
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haiku Salon - Supabase接続テスト</title>
</head>
<body>
  <h1>Supabase接続テスト</h1>
  <pre id="result">接続を確認しています...</pre>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
    async function testSupabase() {
      const output = document.getElementById("result");

      try {
        // 匿名ユーザーとしてログイン
        let { data: sessionData, error: sessionError } =
          await window.haikuSupabase.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          const { data, error } =
            await window.haikuSupabase.auth.signInAnonymously();

          if (error) throw error;
          sessionData.session = data.session;
        }

        output.textContent =
          "① 匿名ログイン：成功\n" +
          "ユーザーID：" + sessionData.session.user.id + "\n\n" +
          "データベースを確認しています...";

        // roomsテーブルを読み取れるか確認
        const { data: rooms, error: roomsError } =
          await window.haikuSupabase
            .from("rooms")
            .select("id")
            .limit(1);

        if (roomsError) throw roomsError;

        output.textContent +=
          "\n② roomsテーブルへのアクセス：成功\n" +
          "読み取れた部屋の件数：" + rooms.length + "\n\n" +
          "接続テスト完了！";
      } catch (error) {
        output.textContent =
          "接続テストに失敗しました。\n\n" +
          (error.message || String(error));
        console.error(error);
      }
    }

    testSupabase();
  </script>
</body>
</html>
